function tell(t){$('.toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').textContent='',2600);}
function coords(id){const p=places[id];return {left:p.x+'%',top:p.y+'%'};}
function objectiveText(s){return s.objectives.items.map(o=>o.type==='score'?o.target.toLocaleString()+'点':o.type==='chain'?o.target+'チェイン':o.type==='surviveTurns'?o.target+'ターン生き残る':o.type==='defeat'?(WORLD.enemyCatalog?.[o.enemyType]||({koitsume:'コイツメ',dame:'ダーメ',hidoime:'ヒドイメ'})[o.enemyType]||o.enemyType)+'を'+o.target+'体倒す':'7を'+o.target+'回つくる').join(s.objectives.mode==='any'?' または ':' ＋ ');}
function missing(id){const u=places[id].unlock,f=flags(),parts=[];for(const x of u.allCleared)if(!cleared.has(x))parts.push(places[x]?.title||x);if(u.anyCleared.length&&!u.anyCleared.some(x=>cleared.has(x)))parts.push('いずれかの前提ステージ');for(const x of u.allFlags)if(!f.has(x))parts.push(area.flags.find(y=>y.id===x)?.label||x);return parts.join('・')+'が必要';}
function layout(){const w=map.clientWidth,h=map.clientHeight;$('#paths').replaceChildren();for(const [a,b] of edges){const p=places[a],q=places[b],dx=(q.x-p.x)*w/100,dy=(q.y-p.y)*h/100,line=document.createElement('div');line.className='path'+(!available(b)?' locked':'')+((p.role==='shortcut'||q.role==='shortcut')?' shortcut-path':'');Object.assign(line.style,{left:p.x+'%',top:`calc(${p.y}% - 4px)`,width:Math.hypot(dx,dy)+'px',transform:`rotate(${Math.atan2(dy,dx)}rad)`});$('#paths').append(line);}}
function render(){
 $('#nodes').replaceChildren();for(const [id,p] of Object.entries(places)){if(id==='start')continue;const locked=!available(id),node=document.createElement('button');node.className='node'+(p.role==='boss'?' boss':'')+(p.role==='shortcut'?' shortcut':'')+(locked?' locked':'')+(cleared.has(id)?' done':'')+(selected===id?' selected':'');node.dataset.id=id;node.setAttribute('aria-label',p.title+(locked?'、未解放。'+missing(id):cleared.has(id)?'、クリア済み':''));node.setAttribute('aria-pressed',String(selected===id));node.setAttribute('aria-disabled',String(locked||busy));Object.assign(node.style,coords(id));node.innerHTML=`<span class="disc"><span class="icon">${locked?'<span class="padlock" aria-hidden="true"></span>':p.icon==='eyes'?'<span class="eyes"><i></i><i></i></span>':p.icon}</span></span>${p.label?`<span class="node-label">${p.label}</span>`:''}${cleared.has(id)?'<span class="check">✓</span>':''}`;node.onclick=()=>go(id);$('#nodes').append(node);}
 const f=flags();document.querySelectorAll('.gem').forEach((e,i)=>{e.classList.toggle('on',f.has(area.flags[i].id));e.setAttribute('aria-label',area.flags[i].label+(f.has(area.flags[i].id)?'取得済み':'未取得'));});$('#progressText').textContent=cleared.has(area.bossStageId)?'草原を奪還！':available(area.bossStageId)?'旗が揃った。ボスへ！':'東と西の旗を集めよう';$('#gate').textContent=cleared.has(area.bossStageId)?'城下への街道へ →':'サイノメ城へ ↑';$('#gate').classList.toggle('open',cleared.has(area.bossStageId));layout();panel();}
function panel(){const p=places[selected];$('#tag').textContent=busy?'ON THE WAY':p.tag;$('#placeTitle').textContent=p.title;$('#description').textContent=busy?'サイカが移動中…':selected==='start'?p.desc:objectiveText(p)+(p.turnLimit?' ／ '+p.turnLimit+'ターン以内':'')+(p.rewards.flags.length?' ／ ⚑ '+p.rewards.flags.map(x=>area.flags.find(f=>f.id===x).label).join('・'):'');$('#status').textContent=cleared.has(selected)?'✓ CLEAR':'';$('#action').disabled=busy||selected==='start';$('#action').textContent=busy?'移動中…':selected==='start'?'マップで行き先を選ぶ':cleared.has(selected)?'もう一度あそぶ':'ここに挑戦';}
function route(from,to){const queue=[[from]],visited=new Set([from]);while(queue.length){const path=queue.shift(),last=path.at(-1);if(last===to)return path.slice(1);for(const [a,b] of edges){const next=a===last?b:b===last?a:null;if(next&&!visited.has(next)&&available(next)){visited.add(next);queue.push([...path,next]);}}}return null;}
async function go(id){if(busy)return;if(!available(id)){tell('🔒 '+missing(id));return;}const steps=route(position,id);if(!steps){tell('通れる道がまだありません');return;}selected=id;busy=true;player.classList.add('walking');render();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;for(const step of steps){const to=coords(step);if(!reduced){const anim=player.animate([coords(position),to],{duration:Math.hypot(places[step].x-places[position].x,places[step].y-places[position].y)*9+80,easing:'ease-in-out',fill:'forwards'});await anim.finished;Object.assign(player.style,to);anim.cancel();}else Object.assign(player.style,to);position=step;}busy=false;player.classList.remove('walking');save();render();$('#announcement').textContent=places[id].title+'に到着';document.querySelector(`[data-id="${id}"]`).focus({preventScroll:true});}
$('#action').onclick=()=>{if(busy||selected==='start')return;$('#missionTitle').textContent=places[selected].title;$('#missionBody').textContent=objectiveText(places[selected])+'。操作確認用：クリアを試すと道や旗の変化を確認できます。';modal.showModal();};
$('#cancel').onclick=()=>modal.close();$('#complete').onclick=()=>{const was=available(area.bossStageId);cleared.add(selected);save();modal.close();render();tell(selected===area.bossStageId?'草原を奪還！ 次は城下への街道。':!was&&available(area.bossStageId)?'⚑ 旗が揃った。ボスへの道が開いた！':places[selected].rewards.flags.length?'⚑ 旗を獲得！':'✦ 新しい道が開いた！');$('#action').focus();};
$('.reset').onclick=()=>{if(!busy)$('#resetDialog').showModal();};$('#cancelReset').onclick=()=>$('#resetDialog').close();$('#confirmReset').onclick=()=>{cleared.clear();position=selected='start';save();Object.assign(player.style,coords(position));render();$('#resetDialog').close();tell('草原の入口に戻りました');};
new ResizeObserver(layout).observe(map);Object.assign(player.style,coords(position));render();
</script>
</html>
